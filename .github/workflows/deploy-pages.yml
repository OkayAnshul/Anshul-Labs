# Publishes the website to GitHub Pages.
#
# `main` is the source branch. On every push to `main`, this workflow copies
# the site files to the `gh-pages` branch, which GitHub Pages serves.
# Do not edit `gh-pages` by hand — it is overwritten on each deploy.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          exclude_assets: ".github,README.md"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy website from main"
